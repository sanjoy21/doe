RewriteRule ^wishlist_help.html wishlist_help.php
RewriteRule ^index.html index.php
RewriteRule ^sitemap.html sitemap.php
RewriteRule ^pages.html pages.php
RewriteRule ^checkout_shipping.html checkout_shipping.php
RewriteRule ^checkout_payment.html checkout_payment.php
